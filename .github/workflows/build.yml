name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
# Least privilege at the workflow level; the (single) build job
# re-grants contents: write for itself only, because it creates the
# release and uploads its assets. The Validate step refuses to run
# unless the ref is a tag, so a manual dispatch from a branch cannot
# create a release.
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate release
        run: |
          python3 - <<'PY'
          import os

          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run this workflow on a release tag, not a branch.')
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Create the release and attach plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from the CHANGELOG section for this version
          # when one exists; otherwise GitHub generates them.
          python3 - <<'PY'
          import os
          import re

          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          notes = ''
          try:
              text = open('CHANGELOG.md', encoding='utf-8').read()
          except OSError:
              text = ''
          match = re.search(
              r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)',
              text, re.MULTILINE | re.DOTALL)
          if match:
              notes = match.group(1).strip()
          with open(os.environ['RUNNER_TEMP'] + '/release-notes.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          PY
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run: refresh the assets on the existing release.
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.zip \
              dist/*.zip.sha256 \
              dist/kiosk-satellite-plugin.json --clobber
          elif [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              dist/*.zip \
              dist/*.zip.sha256 \
              dist/kiosk-satellite-plugin.json
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.zip \
              dist/*.zip.sha256 \
              dist/kiosk-satellite-plugin.json
          fi
