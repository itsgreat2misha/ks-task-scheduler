name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Tuesdays 06:30 UTC.
    - cron: "30 6 * * 2"

# Least privilege at the workflow level; the analyze job grants
# security-events: write for itself only.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Script build (tools/build.py): CodeQL traces the javac
          # calls it makes in the build step below.
          build-mode: manual

      - name: Build plugin package
        run: python3 tools/build.py --android-platform 35

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
