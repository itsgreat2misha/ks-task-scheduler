name: Feature request
description: Suggest an improvement to the Task Scheduler plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what the plugin cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: How you would like it to work. Remove any secrets from example tasks.
    validations:
      required: false
